<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 54px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }

      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 7s ease-in-out infinite; }
      .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Animated Glowing Dynamic Background Elements (positioned in background behind text/cards) -->
  <circle cx="200" cy="80" r="150" fill="#6366f1" opacity="0.25" class="pulse-bg" filter="blur(40px)" />
  <circle cx="1000" cy="220" r="180" fill="#ec4899" opacity="0.2" class="pulse-bg" filter="blur(50px)" />

  <!-- Background Decorative Lines/Grid -->
  <path d="M0 200 Q 300 250 600 200 T 1200 220" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.15" />
  <path d="M0 100 Q 400 50 800 120 T 1200 80" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.15" />

  <!-- Decorative Animated Accent Cards in Far Right / Far Left background space -->
  <g class="floating-card-1" transform="translate(950, 40)">
    <rect width="180" height="100" rx="12" fill="#1e293b" opacity="0.6" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M 970 70 L 1000 95 L 1030 70 M 970 70 L 970 110 L 1030 110 L 1030 70" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="1000" cy="85" r="4" fill="#ec4899"/>
  </g>
  
  <g class="floating-card-2" transform="translate(60, 160)">
    <rect width="160" height="90" rx="12" fill="#1e293b" opacity="0.5" stroke="#ec4899" stroke-width="1.5"/>
  </g>

  <!-- Foreground Main Title & Content (Always visible & crisp) -->
  <g transform="translate(80, 90)">
    <!-- Top Pill Badge -->
    <rect width="210" height="32" rx="16" fill="url(#accent-grad)" opacity="0.9"/>
    <text x="105" y="21" text-anchor="middle" class="badge-text">📬 CURATED DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome Email Client ✉️</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Top Open-Source Projects &amp; Commercial SaaS Email Clients (2026)</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="292" width="1200" height="8" rx="4" fill="url(#accent-grad)"/>
</svg>
